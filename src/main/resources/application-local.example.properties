# Copie para application-local.properties e preencha os segredos localmente.
spring.datasource.url=${APP_DB_URL:jdbc:mysql://localhost:3306/logimarui?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${APP_DB_USERNAME:logimarui-core-api}
spring.datasource.password=${APP_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

app.datasource.read.jdbc-url=${READ_DB_URL:jdbc:mysql://localhost:3306/diretorio?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&useServerPrepStmts=true&readOnlyPropagatesToServer=true}
app.datasource.read.username=${READ_DB_USERNAME:logimarui-core-api}
app.datasource.read.password=${READ_DB_PASSWORD}
app.datasource.read.driver-class-name=com.mysql.cj.jdbc.Driver
app.datasource.read.maximum-pool-size=${READ_DB_POOL_SIZE:5}

security.jwt.secret=${JWT_SECRET}
security.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD}
