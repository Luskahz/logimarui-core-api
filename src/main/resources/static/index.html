<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Local API Tester</title>

    <style>
        * {
          box-sizing: border-box;
          font-family: Arial, Helvetica, sans-serif;
        }

        body {
          margin: 0;
          background: #f2f2f2;
          display: flex;
          height: 100vh;
        }

        aside {
          width: 280px;
          background: #1e1e1e;
          color: #fff;
          padding: 20px;
        }

        aside h2 {
          margin-top: 0;
          font-size: 18px;
        }

        .token-box {
          word-break: break-all;
          font-size: 12px;
          background: #2b2b2b;
          padding: 10px;
          margin-bottom: 10px;
        }

        .token-valid {
          font-size: 13px;
          margin-bottom: 10px;
        }

        button {
          cursor: pointer;
          padding: 8px 12px;
          border: none;
          border-radius: 4px;
        }

        .btn-danger {
          background: #c0392b;
          color: #fff;
        }

        main {
          flex: 1;
          padding: 20px;
          overflow: auto;
        }

        h1 {
          margin-top: 0;
        }

        .card {
          background: #fff;
          padding: 20px;
          border-radius: 6px;
          margin-bottom: 20px;
          box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        label {
          display: block;
          margin-top: 10px;
          font-size: 14px;
        }

        input, select, textarea {
          width: 100%;
          padding: 8px;
          margin-top: 4px;
        }

        textarea {
          min-height: 120px;
          font-family: monospace;
        }

        .row {
          display: flex;
          gap: 10px;
        }

        .row > div {
          flex: 1;
        }

        pre {
          background: #111;
          color: #0f0;
          padding: 15px;
          overflow: auto;
        }

        .hidden {
          display: none;
        }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<aside>
    <h2>Token</h2>

    <div class="token-valid" id="tokenTime">
        Nenhum token
    </div>

    <div class="token-box" id="tokenBox">
        —
    </div>

    <button class="btn-danger" onclick="resetToken()">
        Gerar novo token
    </button>
</aside>

<!-- MAIN -->
<main>

    <!-- LOGIN -->
    <div class="card" id="loginCard">
        <h1>Login</h1>

        <label>Usuário</label>
        <input id="usuario" />

        <label>Senha</label>
        <input id="senha" type="password" />

        <br><br>
        <button onclick="login()">Entrar</button>

        <pre id="loginResult"></pre>
    </div>

    <!-- REQUEST TESTER -->
    <div class="card hidden" id="requestCard">
        <h1>Requisição</h1>

        <div class="row">
            <div>
                <label>Método</label>
                <select id="method">
                    <option>GET</option>
                    <option>POST</option>
                    <option>PUT</option>
                    <option>DELETE</option>
                    <option>PATCH</option>
                </select>
            </div>

            <div>
                <label>Rota</label>
                <input id="url" placeholder="/clientes" />
            </div>
        </div>

        <label>Body (JSON opcional)</label>
        <textarea id="body" placeholder='{"exemplo": true}'></textarea>

        <br>
        <button onclick="sendRequest()">Enviar</button>

        <h3>Resposta</h3>
        <pre id="response"></pre>
    </div>

</main>

<script>
    let token = localStorage.getItem("token");

    if (token) {
      showApp();
      updateTokenInfo();
    }

    function login() {
      const usuario = document.getElementById("usuario").value;
      const senha = document.getElementById("senha").value;

      fetch("http://localhost:8080/auth/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ usuario, senha })
      })
      .then(r => r.json())
      .then(data => {
        if (!data.token) {
          document.getElementById("loginResult").textContent =
            JSON.stringify(data, null, 2);
          return;
        }

        token = data.token;
        localStorage.setItem("token", token);
        showApp();
        updateTokenInfo();
      })
      .catch(err => {
        document.getElementById("loginResult").textContent = err.toString();
      });
    }

    function sendRequest() {
      const method = document.getElementById("method").value;
      const url = document.getElementById("url").value;
      const body = document.getElementById("body").value;

      const options = {
        method,
        headers: {
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json"
        }
      };

      if (body && method !== "GET") {
        options.body = body;
      }

      fetch("http://localhost:8080" + url, options)
        .then(async r => {
          const text = await r.text();
          return { status: r.status, body: text };
        })
        .then(res => {
          document.getElementById("response").textContent =
            "STATUS: " + res.status + "\n\n" + res.body;
        })
        .catch(err => {
          document.getElementById("response").textContent = err.toString();
        });
    }

    function resetToken() {
      localStorage.removeItem("token");
      token = null;
      location.reload();
    }

    function showApp() {
      document.getElementById("loginCard").classList.add("hidden");
      document.getElementById("requestCard").classList.remove("hidden");
      document.getElementById("tokenBox").textContent = token;
    }

    function updateTokenInfo() {
      try {
        const payload = JSON.parse(atob(token.split(".")[1]));
        if (payload.exp) {
          const expMs = payload.exp * 1000;
          const diff = expMs - Date.now();
          const min = Math.floor(diff / 60000);
          document.getElementById("tokenTime").textContent =
            min > 0
              ? `Válido por ${min} min`
              : "Token expirado";
        } else {
          document.getElementById("tokenTime").textContent =
            "JWT sem exp";
        }
      } catch {
        document.getElementById("tokenTime").textContent =
          "Token inválido";
      }
    }
</script>

</body>
</html>
